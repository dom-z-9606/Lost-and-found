<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Campus Lost &amp; Found</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-brand" id="authBrand"><span>Campus Lost &amp; Found</span></div>
      <h1>Create account</h1>
      <p class="sub">Use your ERAU email to get started.</p>

      <div class="alert alert-error" id="signupError" role="alert" hidden></div>

      <form id="signupForm" novalidate>
        <div class="two-col">
          <div class="field">
            <label for="first">First name</label>
            <input class="input" id="first" name="first" type="text" autocomplete="given-name" required>
          </div>
          <div class="field">
            <label for="last">Last name</label>
            <input class="input" id="last" name="last" type="text" autocomplete="family-name" required>
          </div>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input class="input" id="email" name="email" type="email" placeholder="you@my.erau.edu" autocomplete="email" required>
          <p class="hint">Must end with @my.erau.edu or @erau.edu</p>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input class="input" id="password" name="password" type="password" autocomplete="new-password" required>
        </div>
        <button class="btn btn-primary btn-lg" type="submit">Sign Up</button>
      </form>

      <p class="auth-foot">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </main>


  <script src="items-backend.js"></script>
  <script src="ui.js"></script>
  <script>
    document.getElementById('authBrand').insertAdjacentHTML('afterbegin', icon('backpack'));

    const form = document.getElementById('signupForm');
    const errorBox = document.getElementById('signupError');

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      const data = {
        first: form.first.value,
        last: form.last.value,
        email: form.email.value,
        password: form.password.value
      };

      const result = Auth.signup(data);
      if (!result.success) {
        errorBox.textContent = result.message;
        errorBox.hidden = false;
        return;
      }

      // Log the new user in and take them to the home page.
      Auth.login(data.email.trim(), data.password);
      location.href = 'index.html';
    });
  </script>
</body>
</html>
